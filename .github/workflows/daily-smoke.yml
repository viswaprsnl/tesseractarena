name: Daily smoke test

# Runs every night at 21:30 UTC = 03:00 IST (next day).
# Before the arena opens, so a failure gives the team the whole day
# to fix it. Also runnable on-demand via workflow_dispatch for ad-hoc
# verification after a deploy.

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL || 'https://www.tesseractarena.com' }}
      AUTOTEST_TOKEN: ${{ secrets.AUTOTEST_TOKEN }}
      ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
      CI: "true"

    steps:
      - name: Guard — AUTOTEST_TOKEN must be set
        run: |
          if [ -z "${AUTOTEST_TOKEN}" ]; then
            echo "::error::AUTOTEST_TOKEN secret is unset. The suite cannot run — set it in repo Settings → Secrets → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Sweep expired test rows (pre-run cleanup)
        # Delete anything older than retention from previous nights
        # BEFORE this run writes its own fresh rows. If the cleanup
        # endpoint is down we log but don't fail the suite — the test
        # phase is the one that must gate the Discord alert.
        run: |
          set +e
          RESPONSE=$(curl -sS -X POST \
            -H "x-autotest-token: ${AUTOTEST_TOKEN}" \
            "${SMOKE_BASE_URL}/api/admin/autotest-cleanup")
          echo "Cleanup response: ${RESPONSE}"

      - name: Run Playwright suite
        id: tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping Discord alert."
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Pull the per-test outcome from the JSON reporter so the
          # Discord message says exactly which spec failed, not just
          # "something broke." Falls back to a generic message if the
          # report wasn't produced (e.g. the Playwright step crashed
          # before writing).
          FAIL_LIST=$(node -e "
            try {
              const r = require('./playwright-report/results.json');
              // Report only tests whose FINAL result (last retry) is
              // not passed — a test that flaked and recovered isn't a
              // failure; failing attempts on a green test shouldn't
              // show up in the Discord list.
              const fails = [];
              function walk(s) {
                for (const spec of s.specs || []) {
                  for (const t of spec.tests || []) {
                    if (!t.results.length) continue;
                    const last = t.results[t.results.length - 1];
                    if (last.status !== 'passed' && last.status !== 'skipped') {
                      fails.push(spec.title);
                    }
                  }
                }
                for (const sub of s.suites || []) walk(sub);
              }
              for (const s of r.suites || []) walk(s);
              console.log(fails.length ? fails.map(x => '• ' + x).join('\n') : '(no spec-level failures recorded)');
            } catch (e) {
              console.log('(playwright-report/results.json unavailable: ' + e.message + ')');
            }
          ")
          # Discord's embed description tops out at 4096 chars; smoke
          # output is far shorter so a direct POST is fine.
          BODY=$(jq -n \
            --arg content "🚨 **Nightly smoke failed** on ${SMOKE_BASE_URL}" \
            --arg desc "$FAIL_LIST" \
            --arg url "$RUN_URL" \
            '{content: $content, embeds: [{title: "Failing tests", description: $desc, url: $url, color: 15158332}]}')
          curl -sS -H "Content-Type: application/json" \
            -X POST -d "$BODY" \
            "$DISCORD_WEBHOOK_URL"

      - name: Notify Discord on success
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping Discord ping."
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Count passed tests from the Playwright JSON report so the
          # ping actually says "6/6 passed" instead of just "it ran."
          # Falls back to a bare "passed" line if the report is missing
          # (shouldn't happen on success but belt-and-braces).
          STATS=$(node -e "
            try {
              const r = require('./playwright-report/results.json');
              // Count each test ONCE by its final outcome. A flaky test
              // that failed on attempt 1 and passed on retry otherwise
              // double-counts: 1 failed + 1 passed in the raw results[]
              // array, which would spuriously inflate 'total' and under-
              // report 'passed' as e.g. 6/7 for a 6/6 green run.
              let passed = 0, total = 0;
              function walk(s) {
                for (const spec of s.specs || []) {
                  for (const t of spec.tests || []) {
                    if (!t.results.length) continue;
                    const last = t.results[t.results.length - 1];
                    if (last.status === 'skipped') continue;
                    total++;
                    if (last.status === 'passed') passed++;
                  }
                }
                for (const sub of s.suites || []) walk(sub);
              }
              for (const s of r.suites || []) walk(s);
              console.log(passed + '/' + total + ' tests passed');
            } catch (e) {
              console.log('passed');
            }
          ")
          # Success pings go green (3066993) and stay to one line
          # content + a short embed so the channel never fills up.
          # If daily success noise becomes annoying, swap `if: success()`
          # for state-change detection or just delete this step — the
          # failure alert above is the one that matters.
          BODY=$(jq -n \
            --arg content "✅ Nightly smoke green on ${SMOKE_BASE_URL}" \
            --arg desc "$STATS" \
            --arg url "$RUN_URL" \
            '{content: $content, embeds: [{title: "Run details", description: $desc, url: $url, color: 3066993}]}')
          curl -sS -H "Content-Type: application/json" \
            -X POST -d "$BODY" \
            "$DISCORD_WEBHOOK_URL"
